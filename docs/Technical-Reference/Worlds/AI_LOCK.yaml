lock: ORGO-WORLDS-1
product: Orgo_Worlds
standalone: true
sibling_of: Orgo
ownership:
  owns: [World, WorldRelease, WorldMembership, world_control_plane_state]
  references_only: [Signal, WorkflowVersion, Case, Task, IntegrationOperation, InteractionKernel]
storage:
  current: runtime/orgo-worlds-state.json
release_semantics:
  immutable_config: true
  promotion_explicit: true
identity:
  scope: organization
  world_membership_additive: true
forbidden:
  - import_main_Orgo_runtime
  - own_Signal_Case_Task_or_WorkflowVersion
  - own_Interaction_Kernel_product_boundary
  - own_Orgo_outbox_or_provider_adapters
  - shared_database_with_sibling_Orgo
